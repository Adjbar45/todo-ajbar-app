<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cloud To-Do</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 60px auto; background: #f5f5f7; }
    h1 { text-align: center; }
    #todo-form { display: flex; gap: 8px; margin-bottom: 20px; }
    #task-input { flex: 1; padding: 10px; font-size: 16px; }
    button { padding: 10px 16px; font-size: 16px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 10px; background: white;
         padding: 10px; margin-bottom: 6px; border-radius: 6px; }
    li.done span { text-decoration: line-through; color: #888; }
    li span { flex: 1; }
    .delete-btn { background: #e74c3c; color: white; border: none; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>My To-Do List</h1>
  <form id="todo-form">
    <input type="text" id="task-input" placeholder="Add a task..." required>
    <button type="submit">Add</button>
  </form>
  <ul id="todo-list"></ul>

  <script>
    const form = document.getElementById('todo-form');
    const input = document.getElementById('task-input');
    const list = document.getElementById('todo-list');

    async function loadTodos() {
      const res = await fetch('/api/todos');
      const todos = await res.json();
      list.innerHTML = '';
      todos.forEach(todo => {
        const li = document.createElement('li');
        if (todo.done) li.classList.add('done');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.done;
        checkbox.onchange = () => toggleTodo(todo.id, checkbox.checked);

        const span = document.createElement('span');
        span.textContent = todo.task;

        const delBtn = document.createElement('button');
        delBtn.textContent = 'Delete';
        delBtn.className = 'delete-btn';
        delBtn.onclick = () => deleteTodo(todo.id);

        li.append(checkbox, span, delBtn);
        list.appendChild(li);
      });
    }

    async function toggleTodo(id, done) {
      await fetch(`/api/todos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ done })
      });
      loadTodos();
    }

    async function deleteTodo(id) {
      await fetch(`/api/todos/${id}`, { method: 'DELETE' });
      loadTodos();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const task = input.value.trim();
      if (!task) return;
      await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ task })
      });
      input.value = '';
      loadTodos();
    });

    loadTodos();
  </script>
</body>
</html>
